name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install parser
        run: pip install -e apps/telegram-offer-parser
      - name: Test parser
        working-directory: apps/telegram-offer-parser
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test People Radar
        env:
          PYTHONPATH: apps/telegram-offer-parser:services/people-radar
        run: python services/people-radar/test_people_radar.py
      - name: Test Obsidian bot
        working-directory: apps/obsidian-bot
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile remaining components
        run: >-
          python -m py_compile
          apps/obsidian-bot/bot.py
          apps/obsidian-bot/config.py
          apps/obsidian-bot/llm.py
          apps/obsidian-bot/machine_note.py
          apps/obsidian-bot/parser.py
          apps/obsidian-bot/vault.py
          apps/miniapp/app.py
          services/x-collector/x_service.py

